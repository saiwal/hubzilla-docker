name: Docker Image CI for GHCR

permissions:
  contents: read
  packages: write

on:
  push:
    paths: # everything baked into the image
      - 'Dockerfile'
      - 'startup.sh'
      - 'apache-config.conf'
      - 'custom-php.ini'
      - 'ssmtp.conf.template'
      - 'revaliases.template'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch: # allows manual trigger

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - name: Lowercase-ify Repository Name
        run: |
          echo "REPO=${GITHUB_REPOSITORY@L}" >> "${GITHUB_ENV}"

      - name: Compute image tags
        id: tags
        run: |
          PHP=$(sed -n 's/^FROM php:\([0-9.]*\).*/\1/p' Dockerfile)
          VER=$(git ls-remote --tags https://framagit.org/hubzilla/core.git \
            | awk -F/ '{print $NF}' | grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)?$' | sort -V | tail -1)
          [ -z "$VER" ] && echo "::warning::Could not determine latest Hubzilla version; pushing :latest only"
          {
            echo "tags<<EOF"
            echo "ghcr.io/$REPO:latest"
            if [ -n "$VER" ]; then
              echo "ghcr.io/$REPO:$VER"
              [ -n "$PHP" ] && echo "ghcr.io/$REPO:$VER-php$PHP"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and Push Multi-Arch Docker Image
        uses: docker/build-push-action@v6
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.tags.outputs.tags }}
